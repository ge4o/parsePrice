name: Price Monitor

on:
  schedule:
    - cron: "5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: Check Telegram settings
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "ERROR: BOT_TOKEN is empty"
            exit 1
          fi

          if [ -z "$CHAT_ID" ]; then
            echo "ERROR: CHAT_ID is empty"
            exit 1
          fi

          echo "BOT_TOKEN: configured"
          echo "CHAT_ID: configured"

      - name: Test Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["BOT_TOKEN"]
          chat_id = os.environ["CHAT_ID"]

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          response = requests.post(
              url,
              data={
                  "chat_id": chat_id,
                  "text": "Тестовое сообщение из GitHub Actions"
              },
              timeout=30
          )

          print("HTTP:", response.status_code)
          print("Telegram:", response.text)

          response.raise_for_status()
          PY

      - name: Run price monitor
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python price_monitor.py

      - name: Commit price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add prices_history.json

          if git diff --cached --quiet; then
            echo "История не изменилась"
          else
            git commit -m "Update price history"
            git push
          fi
